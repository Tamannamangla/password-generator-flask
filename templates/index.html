<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        body {
            background: #CDC1FF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #FFF6E3;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        label {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 1.1rem;
            margin: 0.5rem 0;
        }

        input[type="number"] {
            padding: 0.5rem;
            width: 80px;
            margin-bottom: 30px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #BFECFF;
            outline: none;
        }

        input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 10px;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1.2rem;
            background: #BFECFF;
            border: none;
            border-radius: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 1rem;
        }

        button:hover {
            background: #A0DAF0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .password-box {
            margin-top: 2rem;
            font-size: 1.4rem;
            font-weight: bold;
            background: #FFCCEA;
            padding: 1.5rem;
            border-radius: 1rem;
            word-break: break-word;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
            margin-bottom: 1rem;
        }

        h3 {
            color: #333;
            font-size: 1.5rem;
            word-wrap: break-word;
            padding: 0.5rem;
            background-color: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            button {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 Password Generator</h1>
        <form action="/" method="post">
            <label>Password Length:</label>
            <input type="number" name="length" min="1" max="30" value="12" required><br>
            <label><input type="checkbox" name="uppercase"> Include Uppercase</label><br>
            <label><input type="checkbox" name="lowercase"> Include Lowercase</label><br>
            <label><input type="checkbox" name="digits"> Include Digits</label><br>
            <label><input type="checkbox" name="symbols"> Include Symbols</label><br>
            <button type="submit">Generate Password</button>
        </form>

        {% if password %}
        <div class="password-box">
            <h2>Your Password:</h2>
            <h3>{{ password }}</h3>
            <input type="text" id="generated-password" value="{{ password }}" style="position:absolute; left:-9999px;">
            <button onclick="copyPassword()">Copy</button>
            <div id="strength-indicator" style="margin-top: 1rem; font-weight: bold;"></div>
        </div>
        <script>
            // Assign the password value to a JavaScript variable
            var password = "{{ password }}";
    
            // Now call the function to check strength
            checkStrength(password);
        </script>
        {% endif %}
        
    </div>
    <script>
        window.onload = function () {
            const password = "{{ password }}";
            if (password) {
                checkStrength(password);
            }
        }
        function copyPassword() {
            const passwordField = document.getElementById("generated-password");
            passwordField.select();
            passwordField.setSelectionRange(0, 99999); // For mobile
            document.execCommand("copy");
            alert("Password copied to clipboard!");
        }

        
        function checkStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
        
            const indicator = document.getElementById("strength-indicator");
            if (strength <= 2) {
                indicator.textContent = "Strength: Weak 🔴";
                indicator.style.color = "red";
            } else if (strength === 3 || strength === 4) {
                indicator.textContent = "Strength: Medium 🟡";
                indicator.style.color = "orange";
            } else {
                indicator.textContent = "Strength: Strong 🟢";
                indicator.style.color = "green";
            }
        }
        
    
      
    </script>
    
</body>
</html>
